name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run zero-dependency TypeScript test suite
        run: npm test
      - name: Verify worker entrypoint imports cleanly
        run: node --experimental-strip-types -e "import('./src/index.ts').then(m => { if (typeof m.default?.fetch !== 'function') process.exit(1); console.log('Worker export verified'); })"
